name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# M3 security review (F-19): previously absent, so this job inherited the
# repository default GITHUB_TOKEN scope. contents: read is all it needs —
# it never pushes anything (that's release.yml, which already scopes its
# own token).
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rwnd
          POSTGRES_PASSWORD: rwnd
          POSTGRES_DB: rwnd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rwnd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rwnd:rwnd@localhost:5432/rwnd
      # Not a real key — only the health/setup/auth paths exercised in CI
      # need the provider to construct without throwing; nothing here
      # actually calls out to TMDB.
      TMDB_API_KEY: ci-placeholder
      # Not real credentials — apps/api/src/test/imports.test.ts stubs
      # `fetch` rather than calling Trakt for real. loadEnv() caches on
      # first call, so these have to be set before any test runs.
      TRAKT_CLIENT_ID: ci-placeholder-client-id
      TRAKT_CLIENT_SECRET: ci-placeholder-client-secret
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # Not a real relay — every test's user-creation helper goes through
      # POST /setup or /auth/register (see apps/api/src/test/helpers.ts),
      # both of which now require SMTP to be configured at all (2026-08-25,
      # see docs/TODO_ARCHIVE.md). localhost with nothing listening gives
      # an immediate ECONNREFUSED rather than a real host's slower connect
      # timeout, so the one code path that does try to send (registration's
      # best-effort verification email) fails fast inside its own try/catch
      # instead of risking a hang.
      SMTP_HOST: localhost
      SMTP_USER: ci
      SMTP_PASS: ci-placeholder
      SMTP_FROM: rwnd.tv <ci@example.com>
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Knip (unused files/exports/dependencies)
        run: pnpm knip

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # M3 security review (F-19): fails the build on a known-vulnerable
      # dependency at high severity or above — complements Dependabot's
      # weekly bumps (.github/dependabot.yml) rather than replacing them.
      - name: Audit dependencies (high/critical)
        run: pnpm audit --prod --audit-level=high

      # Non-blocking: surfaces lower-severity and dev-only findings without
      # wedging main over something like the already-tracked "Hold TS 7
      # bump" item (docs/TODO.md) — visibility, not a gate.
      - name: Audit dependencies (informational)
        run: pnpm audit --audit-level=low || true

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Docker image
        # Tagged (not pushed — that's release.yml) so the Trivy step below
        # can scan it. Also still catches a broken Dockerfile (e.g. a base
        # image bump that drops something the build relies on) before it
        # reaches the release workflow, same as before this review.
        run: docker build -t rwnd-tv:ci .

      # M3 security review (F-19): the image build already happens above,
      # so scanning it here is nearly free — catches a vulnerable OS/base
      # package the source-level audit above can't see.
      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rwnd-tv:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # trivy-action@v0.31.0's own default internal Trivy version
          # (v0.63.0) is a yanked release with no download artifacts —
          # confirmed via `gh api repos/aquasecurity/trivy/releases/tags/v0.63.0`
          # (404) and aquasecurity/trivy-action#516, the same "found
          # version, then a silent exit 1" failure this hit. Pinned to
          # the actual latest release as of this fix; Dependabot won't
          # bump this automatically (it's a `with:` value, not a `uses:`
          # tag), so it may need manual bumping if a future Trivy release
          # gets yanked the same way.
          version: v0.74.0

  dependency-review:
    # Catches a vulnerable dependency a PR *introduces* — pnpm audit above
    # only ever looks at main's current lockfile, not what a PR is about
    # to change it to (M3 security review, F-19). Currently inert in
    # practice: this project pushes directly to main rather than merging
    # PRs against itself, so this job has never actually run. Left in
    # place rather than removed — it starts working the moment an outside
    # contributor opens a PR, with no further setup needed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
