name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Keyless cosign signing (below) exchanges this OIDC token for a
  # short-lived Fulcio cert — no signing key to generate or store.
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/rwnd-tv/rwnd.tv
          tags: |
            # Every push to main is a moving development build. Until the
            # first tagged release, this is the only image self-hosters can
            # run — see the comment on `image:` in docker-compose.yml.
            type=raw,value=edge,enable={{is_default_branch}}
            # v1.2.3 -> 1.2.3, 1.2, latest (semver tags also move `latest`).
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # M3 security review (F-19): scans the image *before* it's built and
      # pushed below (build-push-action with push:false here), so a
      # HIGH/CRITICAL finding blocks the release rather than shipping it.
      # A separate build from the push step's, but from the same
      # Dockerfile/context — Buildx layer caching (cache-from below) keeps
      # this cheap rather than doubling the real build cost.
      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: rwnd-tv:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rwnd-tv:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # See the identical comment on this same input in ci.yml —
          # trivy-action's own default internal Trivy version is a
          # yanked release with no download artifacts.
          version: v0.74.0

      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA provenance + an SBOM attached to the published image (M3
          # security review) — lets a self-hoster (or `docker buildx
          # imagetools inspect`) check what's actually in what they're
          # running.
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing (M3 security review follow-up, docs/TODO.md): no
      # key to generate, rotate, or leak — cosign exchanges this job's GitHub
      # OIDC token for a short-lived cert from Sigstore's Fulcio CA, signs
      # with that, and records the signature in Sigstore's public Rekor
      # transparency log. Signs by digest (not tag) so every tag pointing at
      # this build — edge, a semver tag, latest — is covered by one
      # signature. A self-hoster verifies with:
      #   cosign verify ghcr.io/rwnd-tv/rwnd.tv:edge \
      #     --certificate-identity-regexp 'https://github.com/rwnd-tv/rwnd\.tv/.github/workflows/release\.yml@.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign published image
        run: cosign sign --yes ghcr.io/rwnd-tv/rwnd.tv@${{ steps.push.outputs.digest }}
