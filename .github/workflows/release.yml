name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  # Lets a release be re-run against the current tip without needing a new
  # commit — used to validate this workflow itself, and generally handy if
  # a run needs retrying for reasons unrelated to the code.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Keyless cosign signing (below) exchanges this OIDC token for a
  # short-lived Fulcio cert — no signing key to generate or store.
  id-token: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      json: ${{ steps.meta.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/rwnd-tv/rwnd.tv
          tags: |
            # Every push to main is a moving development build. Until the
            # first tagged release, this is the only image self-hosters can
            # run — see the comment on `image:` in docker-compose.yml.
            type=raw,value=edge,enable={{is_default_branch}}
            # v1.2.3 -> 1.2.3, 1.2, latest (semver tags also move `latest`).
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

  # One native build per platform instead of a single amd64 runner building
  # both natively and (for arm64) under QEMU emulation. Found 2026-08-30: a
  # QEMU-emulated `pnpm install` hit "qemu: uncaught target signal 4
  # (Illegal instruction) - core dumped" mid-install, then hung indefinitely
  # with no further output or error — twice in a row — rather than failing
  # cleanly. GitHub's arm64-hosted runners (free for public repos) build
  # arm64 for real, removing the emulator — and this class of failure with
  # it — entirely, rather than just detecting it faster.
  #
  # Each leg pushes its own single-platform image *by digest* (no tag yet —
  # a tag pointing at a single-platform image would be wrong once both
  # legs need to share it); the `merge` job below combines both digests
  # into the one multi-platform manifest list the tags actually point at,
  # following Docker's documented pattern for this
  # (https://docs.docker.com/build/ci/github-actions/multi-platform/).
  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Turns "linux/amd64" into "linux-amd64" for use in artifact/tag names
      # below, which can't contain a "/".
      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${PLATFORM/\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      # M3 security review (F-19): scans the image *before* it's pushed
      # below (build-push-action with push:false here), so a HIGH/CRITICAL
      # finding blocks the release rather than shipping it. A separate
      # build from the push step's, but from the same Dockerfile/context —
      # Buildx layer caching (cache-from below) keeps this cheap rather
      # than doubling the real build cost. Now genuinely scans *both*
      # platforms — the single-job version this replaced only ever had a
      # runner able to `load` its own native platform (amd64), so the
      # arm64 image was never actually scanned before, a gap nobody had
      # noticed.
      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: rwnd-tv:scan-${{ env.PLATFORM_PAIR }}
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rwnd-tv:scan-${{ env.PLATFORM_PAIR }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # See the identical comment on this same input in ci.yml —
          # trivy-action's own default internal Trivy version is a
          # yanked release with no download artifacts.
          version: v0.74.0

      - id: push
        name: Push by digest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/rwnd-tv/rwnd.tv,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}
          # SLSA provenance + an SBOM attached to the published image (M3
          # security review) — lets a self-hoster (or `docker buildx
          # imagetools inspect`) check what's actually in what they're
          # running. Buildx attaches one of each per platform; `merge`'s
          # imagetools create carries both through into the final manifest
          # list unchanged.
          provenance: true
          sbom: true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.push.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the two single-platform images `build` pushed by digest into
  # the one multi-platform manifest list `meta`'s tags (edge, a semver
  # tag, latest) actually point at.
  merge:
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046 # word splitting here is deliberate —
          # each expands into multiple -t/image@digest arguments.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ needs.meta.outputs.json }}') \
            $(printf 'ghcr.io/rwnd-tv/rwnd.tv@sha256:%s ' *)

      - name: Capture merged manifest digest
        id: merged
        run: |
          first_tag=$(head -n1 <<< '${{ needs.meta.outputs.tags }}')
          digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .}}' | jq -r '.manifest.digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/rwnd-tv/rwnd.tv@${{ steps.merged.outputs.digest }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing (M3 security review follow-up, docs/TODO.md): no
      # key to generate, rotate, or leak — cosign exchanges this job's GitHub
      # OIDC token for a short-lived cert from Sigstore's Fulcio CA, signs
      # with that, and records the signature in Sigstore's public Rekor
      # transparency log. Signs by digest (not tag) so every tag pointing at
      # this build — edge, a semver tag, latest — is covered by one
      # signature, and both platforms are covered by that one signature too
      # (it's the manifest list's own digest, not either platform's). A
      # self-hoster verifies with:
      #   cosign verify ghcr.io/rwnd-tv/rwnd.tv:edge \
      #     --certificate-identity-regexp 'https://github.com/rwnd-tv/rwnd\.tv/.github/workflows/release\.yml@.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign published image
        run: cosign sign --yes ghcr.io/rwnd-tv/rwnd.tv@${{ steps.merged.outputs.digest }}

  # Every push to main moves the `edge` tag onto a new digest, leaving the
  # previous one behind as an untagged image version — same for a semver
  # tag push, once `edge` next moves past it — and the multi-arch matrix
  # above (2026-08-30) fans that into several untagged per-platform/
  # attestation images on top, all accumulating on
  # https://github.com/orgs/rwnd-tv/packages/container/package/rwnd.tv
  # with no retention policy (docs/TODO.md). Runs after every successful
  # release, tagged or not, rather than on a schedule — ties the cleanup
  # to the exact event that creates the mess. Ran once with `dry-run: true`
  # first (2026-08-30) and confirmed via its log: only genuinely untagged,
  # unreferenced digests were marked for deletion — every tagged image
  # (edge/latest/every semver tag) correctly skipped as "in use by
  # another image". That run also caught a real issue before going
  # live — prod's docker-compose.yaml was pinned directly to an
  # edge-derived digest this job would have deleted out from under it;
  # repinned to the permanent v1.0.0 tag first. Deletion here is
  # irreversible, so don't add a new keep/delete rule without
  # dry-running it again first.
  #
  # Deliberately not actions/delete-package-versions: it deletes package
  # versions individually, with no concept of a multi-arch manifest list
  # still referencing a platform-specific digest as a child — exactly the
  # shape `build`/`merge` above now produce. ghcr-cleanup-action is built
  # for this (its whole premise is "safely handles multi-architecture
  # images"): deleting a manifest list also deletes its now-unreferenced
  # platform children, and a still-referenced child is left alone even
  # though it has no tag of its own.
  cleanup:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # No package/owner/keep/exclude options needed: this only ever
      # deletes *untagged* images (the tool's own default with no other
      # rules set) — edge, every semver tag, and latest are never
      # untagged, so "keep every tagged image forever, prune everything
      # else" falls out of the default behavior rather than needing its
      # own rule.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2

  # A tag push alone doesn't create a GitHub Release — they're separate
  # features (found 2026-08-30 comparing this repo's page against
  # another self-hosted project's: rwnd.tv had a Package tab from
  # publishing to GHCR, no Releases tab, since a git tag on its own
  # never produces one). Only runs for a version tag, not a plain push
  # to main (those just move `edge`, nothing to announce).
  #
  # Deliberately not `gh release create --generate-notes`: that's
  # PR-based, and every PR this repo has ever had is a Dependabot bump
  # (direct-push workflow, no feature work ever goes through a PR) —
  # tried it against this exact tag and it produced a changelog that
  # was 100% dependency bumps, nothing about any real feature. Built
  # from the commit log between tags instead, which actually captures
  # what shipped.
  github-release:
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, not the default single-commit shallow clone —
          # need every tag to find the previous one to diff against.
          # fetch-tags explicit, not just implied by fetch-depth: 0 —
          # actions/checkout's own default for it is false.
          fetch-depth: 0
          fetch-tags: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous_tag=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$previous_tag" ]; then
            notes=$(git log "$previous_tag..$GITHUB_REF_NAME" --pretty=format:'- %s')
          else
            notes='First tagged release.'
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
