name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# M3 security review (F-19): previously absent, so this job inherited the
# repository default GITHUB_TOKEN scope. contents: read is all it needs —
# it never pushes anything (that's release.yml, which already scopes its
# own token).
permissions:
  contents: read

jobs:
  # Both architectures run the full job identically — lint through the
  # Docker build/scan — rather than assuming which steps are actually
  # arch-sensitive (native deps like @node-rs/argon2/esbuild/tailwindcss-
  # oxide resolve different per-platform binaries, and this is the only
  # place arm64 gets tested before an actual release build; release.yml
  # itself (2026-08-30) builds arm64 on this same native runner type, not
  # QEMU, after a QEMU-emulation crash there twice in a row). Named `test`,
  # not `ci` — a matrix job's status check posts as "test (amd64,
  # ubuntu-latest)"/"test (arm64, ubuntu-24.04-arm)", not a stable "test",
  # so branch protection's required "ci" check (see the `ci` gate job
  # below) couldn't target it directly.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rwnd
          POSTGRES_PASSWORD: rwnd
          POSTGRES_DB: rwnd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rwnd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rwnd:rwnd@localhost:5432/rwnd
      # Not a real key — only the health/setup/auth paths exercised in CI
      # need the provider to construct without throwing; nothing here
      # actually calls out to TMDB.
      TMDB_API_KEY: ci-placeholder
      # Not real credentials — apps/api/src/test/imports.test.ts stubs
      # `fetch` rather than calling Trakt for real. loadEnv() caches on
      # first call, so these have to be set before any test runs.
      TRAKT_CLIENT_ID: ci-placeholder-client-id
      TRAKT_CLIENT_SECRET: ci-placeholder-client-secret
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # Not a real relay — every test's user-creation helper goes through
      # POST /setup or /auth/register (see apps/api/src/test/helpers.ts),
      # both of which now require SMTP to be configured at all (2026-08-25,
      # see docs/TODO_ARCHIVE.md). localhost with nothing listening gives
      # an immediate ECONNREFUSED rather than a real host's slower connect
      # timeout, so the one code path that does try to send (registration's
      # best-effort verification email) fails fast inside its own try/catch
      # instead of risking a hang.
      SMTP_HOST: localhost
      SMTP_USER: ci
      SMTP_PASS: ci-placeholder
      SMTP_FROM: rwnd.tv <ci@example.com>
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Knip (unused files/exports/dependencies)
        run: pnpm knip

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # M3 security review (F-19), migrated 2026-09-04 from `pnpm audit`:
      # that command calls npm's live bulk-advisories API
      # (registry.npmjs.org/-/npm/v1/security/advisories/bulk), which
      # started timing out intermittently and failing this job with no
      # real vulnerability behind it. Trivy already runs later in this
      # same job for the Docker image scan, reads from its own downloaded
      # vulnerability DB instead of a live per-run API call, and draws
      # from the same underlying GHSA advisory data npm's own audit
      # backend uses — verified against this repo's actual lockfile
      # before switching. Dev dependencies excluded by default (Trivy's
      # own default), matching pnpm audit --prod's scope. node_modules
      # skipped since it's already installed by this point in the job and
      # Trivy only needs the lockfile, not the installed tree. Deliberately
      # not ignore-unfixed here (unlike the image scan below) — pnpm audit
      # had no such carve-out, and this keeps the same strictness.
      - name: Audit dependencies (high/critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: node_modules
          severity: HIGH,CRITICAL
          exit-code: '1'
          version: v0.74.0

      # Non-blocking: surfaces lower-severity and dev-only findings without
      # wedging main over something like the already-tracked "Hold TS 7
      # bump" item (docs/TODO.md) — visibility, not a gate. include-dev-deps
      # (via the TRIVY_INCLUDE_DEV_DEPS env var — Trivy has no matching
      # action input) widens scope back out from the prod-only blocking
      # scan above, same as pnpm audit's own informational step had no
      # --prod flag.
      - name: Audit dependencies (informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: node_modules
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          version: v0.74.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: true

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Docker image
        # Tagged (not pushed — that's release.yml) so the Trivy step below
        # can scan it. Also still catches a broken Dockerfile (e.g. a base
        # image bump that drops something the build relies on) before it
        # reaches the release workflow, same as before this review. Each
        # matrix leg builds for its own runner's native architecture —
        # docker build with no --platform flag always targets the host,
        # so this genuinely produces (and then scans) an arm64 image on
        # the arm64 runner, not a cross-built one.
        run: docker build -t rwnd-tv:ci-${{ matrix.arch }} .

      # M3 security review (F-19): the image build already happens above,
      # so scanning it here is nearly free — catches a vulnerable OS/base
      # package the source-level audit above can't see.
      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rwnd-tv:ci-${{ matrix.arch }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # trivy-action@v0.31.0's own default internal Trivy version
          # (v0.63.0) is a yanked release with no download artifacts —
          # confirmed via `gh api repos/aquasecurity/trivy/releases/tags/v0.63.0`
          # (404) and aquasecurity/trivy-action#516, the same "found
          # version, then a silent exit 1" failure this hit. Pinned to
          # the actual latest release as of this fix; Dependabot won't
          # bump this automatically (it's a `with:` value, not a `uses:`
          # tag), so it may need manual bumping if a future Trivy release
          # gets yanked the same way.
          version: v0.74.0

  # A fixed-name gate `main`'s branch protection rule can require, since
  # `test`'s own check name varies per matrix leg (see the comment on
  # `test` above). Always runs (even if a `test` leg failed or was
  # skipped) so it can fail deliberately instead of silently not posting.
  ci:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test matrix result
        run: |
          result='${{ needs.test.result }}'
          if [ "$result" != "success" ]; then
            echo "test matrix result: $result"
            exit 1
          fi

  dependency-review:
    # Catches a vulnerable dependency a PR *introduces* — pnpm audit above
    # only ever looks at main's current lockfile, not what a PR is about
    # to change it to (M3 security review, F-19). Currently inert in
    # practice: this project pushes directly to main rather than merging
    # PRs against itself, so this job has never actually run. Left in
    # place rather than removed — it starts working the moment an outside
    # contributor opens a PR, with no further setup needed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
