version: 2
updates:
  - package-ecosystem: 'npm'
    # tools/screenshots and tools/seed-demo-account sit outside the pnpm
    # workspace (pnpm-workspace.yaml covers only apps/* and packages/*) and
    # carry their own lockfiles, so a bare directory: '/' never reached
    # them and both quietly rotted: sharp sat on 0.33.5 against a 0.35.4
    # current, with two high-severity libvips/libheif advisories open,
    # until the Dependency graph was enabled on 2026-09-09 and surfaced
    # them. The glob covers any future tool without another edit here.
    directories:
      - '/'
      - '/tools/*'
    schedule:
      interval: weekly
    groups:
      # Majors are excluded so they arrive as their own PRs instead of
      # riding along with routine patches: PR #38 bundled a vitest 4 -> 5
      # major in with seven patch bumps, which makes the whole group only
      # as mergeable as its riskiest member and forces an all-or-nothing
      # call on it. Same problem the `typescript` ignore below works around,
      # generalised to every major rather than one named package.
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
    ignore:
      # typescript-eslint doesn't support TS 7 yet — see docs/TODO.md's
      # "Hold TS 7 bump" item. Without this, Dependabot's dev-dependencies
      # group bundles the TS 7 bump in with unrelated safe updates, so the
      # whole group fails CI (typescript-eslint refuses to run under TS 7)
      # until this ignore is removed.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: weekly
