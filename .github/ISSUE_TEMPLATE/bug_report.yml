name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rwnd.tv version / image tag
      placeholder: e.g. ghcr.io/rwnd-tv/rwnd.tv:edge, or a commit SHA
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: '`docker compose logs app` output, or browser console errors'
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS / Docker version:
        - Browser (if UI-related):
        - Reverse proxy (if any):
